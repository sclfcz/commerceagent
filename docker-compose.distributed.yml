# Isolated MySQL, RabbitMQ and Redis instances for the distributed
# run-claiming subsystem, plus a PostgreSQL instance for the Workspace Memory
# real-server tests. Not wired into the main application: they exist only for
# `dist:*` scripts and the integration tests under tests/distributed/ and
# tests/*real-pg*.
services:
  mysql:
    image: mysql:8.4
    container_name: commerceagent-dist-mysql
    command:
      - --max_connections=200
      - --innodb_lock_wait_timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: dist-root
      MYSQL_DATABASE: dist
      MYSQL_USER: dist
      MYSQL_PASSWORD: dist
      TZ: UTC
    ports:
      # Host port is configurable: the local development MySQL may hold 3307.
      - '${DIST_MYSQL_HOST_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-udist', '-pdist']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - dist-mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: commerceagent-dist-rabbit
    hostname: dist-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: dist
      RABBITMQ_DEFAULT_PASS: dist
      # Pin the Erlang cookie so the image's non-root user can read it on
      # bind-mount-less Docker Desktop hosts.
      RABBITMQ_ERLANG_COOKIE: distcookie
    ports:
      - '${DIST_AMQP_HOST_PORT:-5672}:5672'
      - '${DIST_AMQP_MGMT_HOST_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - dist-rabbit-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: commerceagent-dist-redis
    # AOF: the fencing token must stay monotonic across a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 6379 is often taken locally (Langfuse in this repo's dev setup).
      - '${DIST_REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dist-redis-data:/data

  # Workspace Memory external-PostgreSQL integration tests
  # (`MEMORY_PG_TEST_URL`). PGlite 0.5 embeds PostgreSQL 18, so the image stays
  # on the same major version.
  postgres:
    image: postgres:18-alpine
    container_name: commerceagent-dist-postgres
    environment:
      POSTGRES_USER: memtest
      POSTGRES_PASSWORD: memtest
      POSTGRES_DB: memtest
      TZ: UTC
    ports:
      # 5432 is the common local PostgreSQL port.
      - '${MEMORY_PG_HOST_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memtest -d memtest']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - dist-postgres-data:/var/lib/postgresql

volumes:
  dist-mysql-data:
  dist-rabbit-data:
  dist-redis-data:
  dist-postgres-data:
