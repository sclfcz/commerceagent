# Isolated MySQL instance for the distributed run-claiming subsystem.
# Not wired into the main application: it exists only for `dist:*` scripts
# and the integration tests under tests/distributed/.
services:
  mysql:
    image: mysql:8.4
    container_name: commerceagent-dist-mysql
    command:
      - --max_connections=200
      - --innodb_lock_wait_timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: dist-root
      MYSQL_DATABASE: dist
      MYSQL_USER: dist
      MYSQL_PASSWORD: dist
      TZ: UTC
    ports:
      # Host port is configurable: the local development MySQL may hold 3307.
      - '${DIST_MYSQL_HOST_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-udist', '-pdist']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - dist-mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: commerceagent-dist-rabbit
    hostname: dist-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: dist
      RABBITMQ_DEFAULT_PASS: dist
      # Pin the Erlang cookie so the image's non-root user can read it on
      # bind-mount-less Docker Desktop hosts.
      RABBITMQ_ERLANG_COOKIE: distcookie
    ports:
      - '${DIST_AMQP_HOST_PORT:-5672}:5672'
      - '${DIST_AMQP_MGMT_HOST_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - dist-rabbit-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: commerceagent-dist-redis
    command: ['redis-server', '--appendonly', 'no']
    ports:
      # 6379 is often taken locally (Langfuse in this repo's dev setup).
      - '${DIST_REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dist-redis-data:/data

volumes:
  dist-mysql-data:
  dist-rabbit-data:
  dist-redis-data:
