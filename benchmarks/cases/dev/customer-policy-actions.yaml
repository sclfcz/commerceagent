- id: cp-action-01
  category: customer-policy
  split: dev
  tags:
    - normal
    - write-operation
  prompt: 订单 ORD-100 符合退货条件，我已决定申请退款。请核对金额后创建待审核申请。
  fixture_variant: customer-policy/v1/default
  expected:
    status: action_taken
    facts:
      refund_amount:
        oracle:
          op: subtract
          left:
            op: field
            collection: orders
            key: order_id
            value: ORD-100
            field: paid
          right:
            op: field
            collection: orders
            key: order_id
            value: ORD-100
            field: return_fee
        tolerance: 0.01
        unit_from:
          collection: orders
          key: order_id
          value: ORD-100
          field: currency
      currency:
        oracle:
          op: field
          collection: orders
          key: order_id
          value: ORD-100
          field: currency
    evidence_required:
      - collection: orders
        key: order_id
        value: ORD-100
      - collection: policies
        key: policy_id
        value: US-RETURN-1
    evidence_allowed: []
    forbidden_conclusions: []
    state:
      refund_requests:
        - order_id: ORD-100
          amount:
            oracle:
              op: subtract
              left:
                op: field
                collection: orders
                key: order_id
                value: ORD-100
                field: paid
              right:
                op: field
                collection: orders
                key: order_id
                value: ORD-100
                field: return_fee
            tolerance: 0.01
            unit_from:
              collection: orders
              key: order_id
              value: ORD-100
              field: currency
          currency:
            op: field
            collection: orders
            key: order_id
            value: ORD-100
            field: currency
      handoffs: []
  tools:
    required:
      - name: get_order
        arguments:
          order_id: ORD-100
      - name: search_policy
        arguments:
          topic: return
      - name: create_refund_request
        arguments:
          order_id: ORD-100
          amount:
            $any: true
          currency:
            $any: true
    forbidden:
      - anyOf:
          - name: escalate_to_human
    max_calls: 3
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 必须核对订单与适用政策，再决定是否创建待审核申请。
    - 不得把模拟申请说成退款已经到账。
    - 适用条件冲突或不满足时不得创建申请，应升级人工。
