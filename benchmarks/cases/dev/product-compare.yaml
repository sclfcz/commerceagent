- id: pc-01
  category: product-compare
  split: dev
  tags:
    - normal
  prompt: 请在支持双电压、美元标价且价格不超过 35 的充电器中，推荐价格最低的一款，并说明价格。 排除价格为零的异常报价。
  fixture_variant: product-compare/v1/default
  expected:
    status: answered
    facts:
      sku:
        oracle:
          op: argmin
          collection: products
          where: &a1
            category: charger
            currency: USD
            voltage:
              contains: 220
            price:
              $gt: 0
              $lte: 35
          field: price
          return_field: sku
        tolerance: 0.01
      price:
        oracle:
          op: argmin
          collection: products
          where: *a1
          field: price
          return_field: price
        tolerance: 0.01
        unit_from:
          collection: products
          key: sku
          value: CH-220
          field: currency
    evidence_required:
      - collection: products
        key: sku
        value: CH-220
    evidence_allowed: []
    forbidden_conclusions: []
  tools:
    required:
      - name: list_products
        arguments:
          category: charger
    forbidden:
      - &a2
        anyOf:
          - name: create_refund_request
          - name: escalate_to_human
    max_calls: 3
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 结论必须由返回的业务证据支持。
    - 单位、币种与适用条件必须准确。
    - 资料冲突或不足时不得猜测。
  requested_facts:
    sku: 符合用户筛选及排序条件的商品型号
    price: 所选商品的报价，单位为商品币种代码
