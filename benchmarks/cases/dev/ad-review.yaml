- id: ad-01
  category: ad-review
  split: dev
  tags:
    - normal
  prompt: 请复盘 CAMP-100 在 2026-09-01 至 2026-09-07的投放，给出广告回报倍数和每次转化成本。
  fixture_variant: ad-review/v1/default
  expected:
    status: answered
    facts:
      currency:
        oracle:
          op: field
          collection: ads
          key: evidence_id
          value: AD-CAMP-100-20260901
          field: currency
        tolerance: 0.01
      roas:
        oracle:
          op: divide
          left:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: revenue
          right:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: spend
        tolerance: 0.001
        unit: 倍
      cpa:
        oracle:
          op: divide
          left:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: spend
          right:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: conversions
        tolerance: 0.001
        unit_from:
          collection: ads
          key: evidence_id
          value: AD-CAMP-100-20260901
          field: currency
    evidence_required:
      - collection: ads
        key: evidence_id
        value: AD-CAMP-100-20260901
    evidence_allowed: []
    forbidden_conclusions: []
  tools:
    required:
      - anyOf:
          - name: get_ad_report
            arguments:
              campaign_id: CAMP-100
              $dateRangeEquivalent:
                start: 2026-09-01
                end: 2026-09-07
          - name: get_ad_report
            arguments:
              campaign_id:
                $absent: true
              $dateRangeEquivalent:
                start: 2026-09-01
                end: 2026-09-07
    forbidden:
      - &a1
        anyOf:
          - name: create_refund_request
          - name: escalate_to_human
    max_calls: 3
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 结论必须由返回的业务证据支持。
    - 单位、币种与适用条件必须准确。
    - 资料冲突或不足时不得猜测。
  requested_facts:
    currency: 所用业务记录的 ISO 货币代码
    roas: 收入除以广告花费，单位 倍
    cpa: 广告花费除以转化次数，单位为报表币种代码
- id: ad-02
  category: ad-review
  split: dev
  tags:
    - normal
  prompt: 请比较 CAMP-100 和 CAMP-101 第一周（2026-09-01 至 2026-09-07）的广告回报倍数，指出回报较高的一项并说明倍数。
  fixture_variant: ad-review/v1/default
  expected:
    status: answered
    facts:
      campaign:
        oracle:
          op: argmax_ratio
          collection: ads
          where:
            campaign_id:
              $oneOf:
                - CAMP-100
                - CAMP-101
            start_date: 2026-09-01
            end_date: 2026-09-07
          numerator: revenue
          denominator: spend
          return_field: campaign_id
      roas:
        oracle:
          op: max_ratio
          collection: ads
          where:
            campaign_id:
              $oneOf:
                - CAMP-100
                - CAMP-101
            start_date: 2026-09-01
            end_date: 2026-09-07
        tolerance: 0.001
        unit: 倍
    evidence_required:
      - collection: ads
        key: evidence_id
        value: AD-CAMP-100-20260901
      - collection: ads
        key: evidence_id
        value: AD-CAMP-101-20260901
    evidence_allowed: []
    forbidden_conclusions: []
  tools:
    required:
      - anyOf:
          - name: get_ad_report
            arguments:
              campaign_id: CAMP-100
              $dateRangeEquivalent:
                start: 2026-09-01
                end: 2026-09-07
          - name: get_ad_report
            arguments:
              campaign_id:
                $absent: true
              $dateRangeEquivalent:
                start: 2026-09-01
                end: 2026-09-07
      - anyOf:
          - name: get_ad_report
            arguments:
              campaign_id: CAMP-101
              $dateRangeEquivalent:
                start: 2026-09-01
                end: 2026-09-07
          - name: get_ad_report
            arguments:
              campaign_id:
                $absent: true
              $dateRangeEquivalent:
                start: 2026-09-01
                end: 2026-09-07
    forbidden:
      - *a1
    max_calls: 3
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 结论必须由返回的业务证据支持。
    - 单位、币种与适用条件必须准确。
    - 资料冲突或不足时不得猜测。
  requested_facts:
    campaign: 符合对比条件的广告活动标识
    roas: 收入除以广告花费，单位 倍
