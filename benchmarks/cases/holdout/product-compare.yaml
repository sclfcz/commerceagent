- id: pc-15
  category: product-compare
  split: holdout
  tags:
    - normal
  prompt: 请在美元计价且支持 110V 的充电器中，筛选不超过 30 美元的型号并推荐最低价款。 本题零价是可选的合法报价。
  fixture_variant: product-compare/v1/pagination
  expected:
    status: answered
    facts:
      sku:
        oracle:
          op: argmin
          collection: products
          where: &a1
            category: charger
            currency: USD
            voltage:
              contains: 110
            price:
              $lte: 30
          field: price
          return_field: sku
        tolerance: 0.01
      price:
        oracle:
          op: argmin
          collection: products
          where: *a1
          field: price
          return_field: price
        tolerance: 0.01
        unit_from:
          collection: products
          key: sku
          value: CH-0
          field: currency
    evidence_required:
      - collection: products
        key: sku
        value: CH-0
    evidence_allowed: []
    forbidden_conclusions: []
  tools:
    required:
      - name: list_products
        arguments:
          category: charger
    forbidden:
      - &a3
        anyOf:
          - name: create_refund_request
          - name: escalate_to_human
    max_calls: 6
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 结论必须由返回的业务证据支持。
    - 单位、币种与适用条件必须准确。
    - 资料冲突或不足时不得猜测。
  requested_facts:
    sku: 符合用户筛选及排序条件的商品型号
    price: 所选商品的报价，单位为商品币种代码
- id: pc-16
