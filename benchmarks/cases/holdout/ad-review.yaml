- id: ad-15
  category: ad-review
  split: holdout
  tags:
    - normal
  prompt: 请复盘 CAMP-100 在 2026 年 9 月 1 日至 7 日的投放，给出广告回报倍数和每次转化成本。
  fixture_variant: ad-review/v1/default
  expected:
    status: answered
    facts:
      currency:
        oracle:
          op: field
          collection: ads
          key: evidence_id
          value: AD-CAMP-100-20260901
          field: currency
        tolerance: 0.01
      roas:
        oracle:
          op: divide
          left:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: revenue
          right:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: spend
        tolerance: 0.001
        unit: 倍
      cpa:
        oracle:
          op: divide
          left:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: spend
          right:
            op: field
            collection: ads
            key: evidence_id
            value: AD-CAMP-100-20260901
            field: conversions
        tolerance: 0.001
        unit_from:
          collection: ads
          key: evidence_id
          value: AD-CAMP-100-20260901
          field: currency
    evidence_required:
      - collection: ads
        key: evidence_id
        value: AD-CAMP-100-20260901
    evidence_allowed: []
    forbidden_conclusions: []
  tools:
    required:
      - name: get_ad_report
        arguments:
          campaign_id: CAMP-100
          $dateRangeEquivalent:
            start: 2026-09-01
            end: 2026-09-07
    forbidden:
      - &a1
        anyOf:
          - name: create_refund_request
          - name: escalate_to_human
    max_calls: 3
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 结论必须由返回的业务证据支持。
    - 单位、币种与适用条件必须准确。
    - 资料冲突或不足时不得猜测。
