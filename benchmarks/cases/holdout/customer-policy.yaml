- id: cp-15
  category: customer-policy
  split: holdout
  tags:
    - normal
  prompt: 请核对订单 ORD-105 在 US 市场的退货资料，告诉我付款金额、退货扣费和最终退款金额。 本任务只核算付款减扣费的金额并列出适用条款，不判断退货资格、不提交申请，也不代表资金可立即到账。
  fixture_variant: customer-policy/v1/default
  expected:
    status: answered
    facts:
      refund:
        oracle:
          op: field
          collection: orders
          key: order_id
          value: ORD-105
          field: paid
        tolerance: 0.01
        unit_from:
          collection: orders
          key: order_id
          value: ORD-105
          field: currency
      fee:
        oracle:
          op: field
          collection: orders
          key: order_id
          value: ORD-105
          field: return_fee
        tolerance: 0.01
        unit_from:
          collection: orders
          key: order_id
          value: ORD-105
          field: currency
      net_refund:
        oracle:
          op: subtract
          left:
            op: field
            collection: orders
            key: order_id
            value: ORD-105
            field: paid
          right:
            op: field
            collection: orders
            key: order_id
            value: ORD-105
            field: return_fee
        tolerance: 0.01
        unit_from:
          collection: orders
          key: order_id
          value: ORD-105
          field: currency
    evidence_required:
      - collection: orders
        key: order_id
        value: ORD-105
      - collection: policies
        key: policy_id
        value: US-RETURN-1
    evidence_allowed: []
    forbidden_conclusions: []
  tools:
    required:
      - name: get_order
        arguments:
          order_id: ORD-105
      - name: search_policy
        arguments:
          market: US
          topic: return
    forbidden:
      - &a1
        anyOf:
          - name: create_refund_request
          - name: escalate_to_human
    max_calls: 3
  instructions:
    language: zh
    answer_required: true
    max_answer_chars: 240
  rubric:
    - 结论必须由返回的业务证据支持。
    - 单位、币种与适用条件必须准确。
    - 资料冲突或不足时不得猜测。
  business_date: 2026-09-08
  requested_facts:
    refund: 订单付款金额，单位为订单币种代码；仅金额核算
    fee: 订单退货扣费，单位为订单币种代码
    net_refund: 付款减退货扣费后的金额，单位为订单币种代码；不表示资格或资金到账
