<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%icons/commerceagent-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d9488" />

    <!-- PWA iOS Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CommerceAgent" />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%icons/apple-touch-icon-180.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- iOS PWA 优化：保留自动识别控制（页面缩放已允许） -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />

    <!-- DM Sans: loaded locally via @font-face in globals.css -->

    <!-- 预热认证：AuthGuard 放行前整棵已登录子树都不渲染，若等入口 JS 执行后
         才发 /api/auth/me，这个 RTT 会和分片下载串行。这里在 HTML 解析阶段就
         发出请求，stores/auth.ts 一次性消费 window.__authPrewarm。 -->
    <script>
      window.__authPrewarm = fetch('%BASE_URL%api/auth/me', {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      }).catch(function () {
        return null;
      });
    </script>

    <title>CommerceAgent</title>
  </head>
  <body>
    <script>
      (function () {
        var d = document.documentElement,
          s = localStorage.getItem('commerceagent-theme');
        if (
          s === 'dark' ||
          (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        )
          d.classList.add('dark');
        var c = localStorage.getItem('commerceagent-color-scheme');
        if (c === 'orange') d.classList.add('theme-orange');
        if (c === 'neutral') d.classList.add('theme-neutral');
        if (localStorage.getItem('commerceagent-font-style') === 'anthropic')
          d.classList.add('font-anthropic');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
